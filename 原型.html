// ==================== UTILS ====================
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

let _nextId = 200;
function nextId() { return _nextId++; }

function timeAgo(dateStr) {
  const now = new Date();
  const d = new Date(dateStr);
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  return Math.floor(diff/86400) + '天前';
}

function getInitial(name) { return name ? name.charAt(0) : '?'; }

function avatarHtml(name, size='w-8 h-8', textSize='text-xs') {
  const colors = ['bg-blue-500','bg-green-500','bg-purple-500','bg-pink-500','bg-orange-500','bg-teal-500'];
  const idx = name ? name.charCodeAt(0) % colors.length : 0;
  return `<div class="${size} ${colors[idx]} rounded-full flex items-center justify-center text-white ${textSize} font-medium flex-shrink-0">${getInitial(name)}</div>`;
}

function showModal(html) {
  $('#modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-2xl shadow-xl max-w-sm w-full mx-4 p-6 fade-in">${html}</div></div>`;
}

function closeModal() { $('#modal-root').innerHTML = ''; }

// ==================== MODE SWITCHING ====================
function switchMode(mode) {
  store.mode = mode;
  $('#mini-container').style.display = mode === 'mini' ? 'flex' : 'none';
  $('#admin-container').style.display = mode === 'admin' ? 'flex' : 'none';
  $('#btn-mini').className = mode === 'mini' ? 'px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-lake text-white' : 'px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 hover:bg-gray-200';
  $('#btn-admin').className = mode === 'admin' ? 'px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-lake text-white' : 'px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-600 hover:bg-gray-200';
  if (mode === 'mini') renderMini();
  else renderAdmin();
}

// ==================== MINI PROGRAM ====================
function renderMini() {
  const page = store.miniPage;
  const showTabBar = store.miniLoggedIn && !['login','poster'].includes(page);
  $('#mini-tabbar').style.display = showTabBar ? 'flex' : 'none';
  if (showTabBar) renderTabBar();
  const container = $('#mini-page');
  if (page === 'login') container.innerHTML = renderMiniLogin();
  else if (page === 'home') container.innerHTML = renderMiniHome();
  else if (page === 'create') container.innerHTML = renderMiniCreate();
  else if (page === 'preview') container.innerHTML = renderMiniPreview();
  else if (page === 'detail') container.innerHTML = renderMiniDetail();
  else if (page === 'profile') container.innerHTML = renderMiniProfile();
  else if (page === 'review') container.innerHTML = renderMiniReview();
  else if (page === 'commission') container.innerHTML = renderMiniCommission();
  else if (page === 'messages') container.innerHTML = renderMiniMessages();
  else if (page === 'poster') container.innerHTML = renderMiniPoster();
  container.scrollTop = 0;
}

function renderTabBar() {
  const tabs = [
    { key: 'home', label: '首页', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>' },
    { key: 'create', label: '投稿', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>', action: true },
    { key: 'messages', label: '消息', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>' },
    { key: 'profile', label: '我的', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>' },
  ];
  const unread = store.notifications.filter(n => !n.read).length;
  $('#mini-tabbar').innerHTML = tabs.map(t => {
    const isActive = t.action ? false : store.miniTab === t.key;
    return `<button onclick="${t.action ? "store.miniPage='create';renderMini()" : "store.miniTab='"+t.key+"';store.miniPage='"+t.key+"';renderMini()"}" class="flex flex-col items-center justify-center flex-1 h-full btn-press ${t.action ? 'text-lake' : isActive ? 'text-lake' : 'text-gray-400'}">
      <div class="relative"><svg class="w-5 h-5 ${t.action ? '' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">${t.icon}</svg>${t.key === 'messages' && unread > 0 ? '<span class="absolute -top-1 -right-2 bg-rose2 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">'+unread+'</span>' : ''}</div>
      <span class="text-[10px] mt-0.5 ${t.action ? 'font-semibold' : ''}">${t.label}</span>
    </button>`;
  }).join('');
}

function navigateMini(page, tab) {
  store.miniPage = page;
  if (tab) store.miniTab = tab;
  renderMini();
}

}
function previewPost() {
  if (!store.newPost.content.trim()) { showModal('<p class="text-sm text-gray-600 text-center">请输入投稿内容</p><button onclick="closeModal()" class="mt-4 w-full py-2 bg-lake text-white rounded-lg text-sm btn-press">确定</button>'); return; }
  navigateMini('preview');
}
function submitPost() {
  if (!store.newPost.content.trim()) { showModal('<p class="text-sm text-gray-600 text-center">请输入投稿内容</p><button onclick="closeModal()" class="mt-4 w-full py-2 bg-lake text-white rounded-lg text-sm btn-press">确定</button>'); return; }
  const post = { id: nextId(), channel: store.newPost.channel, content: store.newPost.content, tags: [...store.newPost.tags], bgColor: store.newPost.bgColor, likes: 0, comments: 0, status: 'pending', author: store.user.nickname, createdAt: new Date().toLocaleString('zh-CN') };

  store.myPosts.unshift({ id: post.id, content: post.content, channel: post.channel, status: 'pending', bgColor: post.bgColor, createdAt: post.createdAt });
  store.newPost = { channel: '表白', content: '', images: [], tags: [], bgColor: '#FEF3C7' };

}

          ${p.comments}
        </span>
      </div>
      <!-- Comments -->
      <div>
        <div class="text-sm font-medium text-gray-800 mb-2">评论 (${postComments.length})</div>
        ${postComments.length === 0 ? '<div class="text-xs text-slate2 text-center py-4">暂无评论</div>' :
          postComments.map(c => `<div class="flex gap-2 mb-3">

}

function toggleLike(postId) {
  const idx = store.myLikes.indexOf(postId);
  const post = store.posts.find(p => p.id === postId);
  if (idx >= 0) { store.myLikes.splice(idx, 1); post.likes--; }
  else { store.myLikes.push(postId); post.likes++; }
  renderMini();
}

function addComment(postId) {
  const input = $('#comment-input');
  if (!input || !input.value.trim()) return;
  store.comments.push({ id: nextId(), postId, author: store.user.nickname, content: input.value.trim(), createdAt: new Date().toLocaleString('zh-CN') });
  const post = store.posts.find(p => p.id === postId);
  if (post) post.comments++;
  renderMini();
}

function renderMiniReview() {
  const pending = store.posts.filter(p => p.status === 'pending');
  const approved = store.posts.filter(p => p.status === 'approved').length;
  const rejected = store.posts.filter(p => p.status === 'rejected').length;
  return `<div class="fade-in">
    <div class="sticky top-0 z-10 bg-white border-b border-gray-100 px-4 py-2.5 flex items-center">
      <button onclick="navigateMini('profile','profile')" class="text-lake text-sm btn-press">← 返回</button>
      <span class="flex-1 text-center font-semibold text-sm text-gray-800">审核管理</span>
      <div class="w-12"></div>
    </div>
    <div class="p-4 space-y-3">
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-yellow-50 rounded-lg p-2.5 text-center"><div class="text-lg font-semibold text-yellow-600">${pending.length}</div><div class="text-[10px] text-yellow-600">待审核</div></div>
        <div class="bg-green-50 rounded-lg p-2.5 text-center"><div class="text-lg font-semibold text-green-600">${approved}</div><div class="text-[10px] text-green-600">已通过</div></div>
        <div class="bg-red-50 rounded-lg p-2.5 text-center"><div class="text-lg font-semibold text-red-600">${rejected}</div><div class="text-[10px] text-red-600">已驳回</div></div>
      </div>
      <div class="text-sm font-medium text-gray-800">待审核投稿</div>
      ${pending.length === 0 ? '<div class="text-center text-slate2 text-xs py-8">暂无待审核投稿</div>' :
        pending.map(p => `<div class="bg-white rounded-xl p-3 border border-gray-100">
          <div class="flex items-center gap-2 mb-1.5">
            ${avatarHtml(p.author, 'w-6 h-6', 'text-[10px]')}
            <span class="text-xs font-medium text-gray-700">${p.author}</span>
            <span class="text-[10px] text-gray-400">${p.channel} · ${timeAgo(p.createdAt)}</span>
          </div>
          <p class="text-xs text-gray-600 line-clamp-2 mb-2">${p.content}</p>
          <div class="flex gap-2">
            <button onclick="approvePost(${p.id})" class="flex-1 py-1.5 bg-emerald2 text-white rounded-lg text-xs font-medium btn-press">通过</button>
            <button onclick="rejectPost(${p.id})" class="flex-1 py-1.5 bg-rose2 text-white rounded-lg text-xs font-medium btn-press">驳回</button>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function approvePost(id) {
  const p = store.posts.find(x => x.id === id);
  if (p) { p.status = 'approved'; }
  const mp = store.myPosts.find(x => x.id === id);
  if (mp) mp.status = 'approved';
  store.notifications.unshift({ id: nextId(), type: 'audit', title: '投稿审核通过', content: `你的投稿"${p?p.content.substring(0,10):''}..."已通过审核`, read: false, postId: id, createdAt: new Date().toLocaleString('zh-CN') });
  renderMini();
}

function rejectPost(id) {
  showModal(`
    <h3 class="font-semibold text-base mb-3">驳回原因</h3>
    <textarea id="reject-reason" class="w-full h-20 p-2 border border-gray-200 rounded-lg text-sm resize-none focus:outline-none focus:border-lake" placeholder="请输入驳回原因..."></textarea>
    <div class="flex gap-2 mt-3">
      <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm btn-press">取消</button>
      <button onclick="doReject(${id})" class="flex-1 py-2 bg-rose2 text-white rounded-lg text-sm btn-press">确认驳回</button>
    </div>
  `);
}

function doReject(id) {
  const reason = $('#reject-reason')?.value || '内容不符合规范';
  const p = store.posts.find(x => x.id === id);
  if (p) p.status = 'rejected';
  const mp = store.myPosts.find(x => x.id === id);
  if (mp) { mp.status = 'rejected'; mp.rejectReason = reason; }
  store.notifications.unshift({ id: nextId(), type: 'audit', title: '投稿被驳回', content: `你的投稿被驳回，原因：${reason}`, read: false, postId: id, createdAt: new Date().toLocaleString('zh-CN') });
  closeModal();
  renderMini();
}

function showWithdrawModal() {
  showModal(`
    <h3 class="font-semibold text-base mb-3">申请提现</h3>
    <div class="text-xs text-slate2 mb-3">可提现金额：¥${store.commission.available}</div>
    <input id="withdraw-amount" type="number" placeholder="输入提现金额" class="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm mb-2 focus:outline-none focus:border-lake">
    <select id="withdraw-method" class="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm mb-3 focus:outline-none focus:border-lake">
      <option value="微信">微信</option>
      <option value="支付宝">支付宝</option>
    </select>
    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm btn-press">取消</button>
      <button onclick="doWithdraw()" class="flex-1 py-2 bg-lake text-white rounded-lg text-sm btn-press">确认提现</button>
    </div>
  `);
}

function doWithdraw() {
  const amount = parseFloat($('#withdraw-amount')?.value);
  const method = $('#withdraw-method')?.value || '微信';
  if (!amount || amount <= 0 || amount > store.commission.available) {
    showModal('<p class="text-sm text-gray-600 text-center">请输入有效金额</p><button onclick="closeModal()" class="mt-4 w-full py-2 bg-lake text-white rounded-lg text-sm btn-press">确定</button>');
    return;
  }
  store.commission.available -= amount;
  store.commission.withdrawn += amount;
  store.commissionRecords.unshift({ id: nextId(), type: 'withdraw', amount, desc: `提现到${method}`, status: 'pending', createdAt: new Date().toLocaleDateString('zh-CN') });
  store.withdrawApps.unshift({ id: nextId(), applicant: store.user.nickname, amount, method, status: 'pending', createdAt: new Date().toLocaleDateString('zh-CN') });
  closeModal();
  renderMini();
}

  const ch = editId ? store.channels.find(c => c.id === editId) : null;
  showModal(`
    <h3 class="font-semibold text-base mb-3">${ch?'编辑频道':'新增频道'}</h3>
    <div class="space-y-3">
      <div><label class="text-sm text-gray-600 mb-1 block">频道名称</label><input id="ch-name" type="text" value="${ch?ch.name:''}" class="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-lake"></div>
      <div><label class="text-sm text-gray-600 mb-1 block">排序</label><input id="ch-sort" type="number" value="${ch?ch.sort:store.channels.length+1}" class="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-lake"></div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm btn-press">取消</button>
      <button onclick="saveChannel(${editId||0})" class="flex-1 py-2 bg-lake text-white rounded-lg text-sm btn-press">保存</button>
    </div>
  `);
}

function saveChannel(editId) {
  const name = $('#ch-name')?.value;
  const sort = parseInt($('#ch-sort')?.value) || 1;
  if (!name?.trim()) return;
  if (editId) { const ch = store.channels.find(c => c.id === editId); if (ch) { ch.name = name; ch.sort = sort; } }
  else { store.channels.push({ id: nextId(), name, sort, status: 'active' }); }
  closeModal();
  renderAdmin();
}

// ---- Admin: Push ----
function renderAdminPush() {
  return `<div class="space-y-4">
    <h2 class="text-xl font-semibold text-gray-800">通知推送</h2>
    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 class="text-sm font-medium text-gray-800 mb-3">发送推送</h3>
        <div class="space-y-3">
          <div><label class="text-sm text-gray-600 mb-1 block">推送范围</label>
            <select id="push-range" class="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-lake">
              <option>全部用户</option><option>墙主</option><option>普通用户</option>
            </select>
          </div>
          <div><label class="text-sm text-gray-600 mb-1 block">推送内容</label>
            <textarea id="push-content" class="w-full h-24 p-3 border border-gray-200 rounded-lg text-sm resize-none focus:outline-none focus:border-lake" placeholder="输入推送内容..."></textarea>
          </div>
          <button onclick="sendPush()" class="w-full py-2 bg-lake text-white rounded-lg text-sm font-medium btn-press">发送推送</button>
        </div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 class="text-sm font-medium text-gray-800 mb-3">推送记录</h3>
        <div class="space-y-2">
          ${store.pushRecords.map(r => `<div class="py-2 border-b border-gray-50 last:border-0">
            <div class="flex items-center justify-between"><span class="text-xs font-medium text-gray-700">${r.range}</span><span class="text-[10px] text-slate2">${r.createdAt}</span></div>
            <p class="text-xs text-gray-500 mt-0.5">${r.content}</p>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function sendPush() {
  const range = $('#push-range')?.value || '全部用户';
  const content = $('#push-content')?.value;
  if (!content?.trim()) return;
  store.pushRecords.unshift({ id: nextId(), range, content, createdAt: new Date().toLocaleDateString('zh-CN'), status: 'sent' });
  store.notifications.unshift({ id: nextId(), type: 'system', title: '系统通知', content, read: false, createdAt: new Date().toLocaleString('zh-CN') });
  renderAdmin();
}

// ---- Admin: Tutorials ----
function renderAdminTutorials() {
  return `<div class="space-y-4">
    <h2 class="text-xl font-semibold text-gray-800">教程管理</h2>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 space-y-4">
      ${store.tutorials.map(t => `<div class="border-b border-gray-100 pb-4 last:border-0">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-700">${t.title}</span>
          <span class="text-[10px] text-slate2">更新于 ${t.updatedAt}</span>
        </div>
        <textarea onchange="store.tutorials.find(x=>x.id===${t.id}).content=this.value" class="w-full h-32 p-3 border border-gray-200 rounded-lg text-sm resize-none focus:outline-none focus:border-lake">${t.content}</textarea>
      </div>`).join('')}
      <button onclick="store.tutorials.push({id:nextId(),title:'新教程',content:'',updatedAt:new Date().toLocaleDateString('zh-CN')});renderAdmin()" class="px-4 py-2 bg-lake text-white rounded-lg text-sm font-medium btn-press shadow-sm">+ 新增教程</button>
    </div>
  </div>`;
}

// ---- Admin: Agreement ----
function renderAdminAgreement() {
  return `<div class="space-y-4">
    <h2 class="text-xl font-semibold text-gray-800">用户协议管理</h2>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
      <textarea id="agreement-editor" onchange="store.agreement=this.value" class="w-full h-80 p-3 border border-gray-200 rounded-lg text-sm resize-none focus:outline-none focus:border-lake leading-relaxed">${store.agreement}</textarea>
      <div class="flex justify-end mt-3">
        <button onclick="showModal('<p class=\\'text-sm text-gray-600 text-center\\'>协议内容已保存</p><button onclick=\\'closeModal()\\' class=\\'mt-4 w-full py-2 bg-lake text-white rounded-lg text-sm btn-press\\'>确定</button>')" class="px-6 py-2 bg-lake text-white rounded-lg text-sm font-medium btn-press shadow-sm">保存</button>
      </div>
    </div>
  </div>`;
}

// ==================== INIT ====================
switchMode('mini');
</script>
</body>
</html>
